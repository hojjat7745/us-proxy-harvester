name: Auto-Harvest Verified US Proxy Configs

on:
  schedule:
    # Runs automatically on schedule (default: every 6 hours)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us-proxy-harvest
  cancel-in-progress: true

jobs:
  harvest-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Xray-core & sing-box for real tunnel verification
        run: |
          mkdir -p bin
          XRAY_URL="https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
          curl -sSL "$XRAY_URL" -o /tmp/xray.zip
          unzip -o /tmp/xray.zip xray geoip.dat geosite.dat -d bin/
          chmod +x bin/xray
          ./bin/xray version

      - name: Run US Proxy Harvester (Scrape -> GeoIP -> Tunnel Ping & Speed Test -> Export)
        env:
          XRAY_BIN: ${{ github.workspace }}/bin/xray
        run: |
          python -m src.main

      - name: Upload scan summary artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-configs-report
          path: output/report.json
          retention-days: 7

      - name: Commit and push verified US configs to public repository
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No changes in verified US configs."
            exit 0
          fi
          git commit -m "chore(configs): auto-update verified US configs [skip ci]"
          git push origin HEAD:main
